micronaut:
  server:
    port: 0

datasources:
  default:
    driverClassName: org.postgresql.Driver
    schema-generate: CREATE_DROP
    dialect: POSTGRES
    db-type: postgresql

jpa:
  default:
    entity-scan:
      packages:
        - net.onelitefeather.vulpes.api.model
    properties:
      hibernate:
        hbm2ddl.auto: update
        dialect: org.hibernate.dialect.PostgreSQLDialect
test-resources:
  containers:
    postgresql:
      image-name: postgres:16