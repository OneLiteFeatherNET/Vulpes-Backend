micronaut:
  server:
    port: 8085
    cors:
      configurations:
        all:
          # The Blockbench desktop plugin runs in a file:// renderer and sends the origin "null".
          allowedOriginsRegex:
            - '^(https?://(localhost|127\.0\.0\.1)(:\d+)?|null|file://.*)$'
  object-storage:
    local:
      assets:
        # All worktrees share the one local database, so they share one asset directory as well.
        # Override with MICRONAUT_OBJECT_STORAGE_LOCAL_ASSETS_PATH.
        path: ${user.home}/.local/share/vulpes/assets

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/vulpesdb
    driverClassName: org.postgresql.Driver
    username: vulpes
    password: vulpespassword
    dialect: POSTGRES
    schema-generate: NONE
    maximum-pool-size: 10

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl.auto: update
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
