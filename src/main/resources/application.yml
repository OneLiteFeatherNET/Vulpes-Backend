micronaut:
  application:
    name: Vulpes Backend
  server:
    port: ${PORT:8085}
    cors:
      enabled: true
      configurations:
        all:
          allowedOriginsRegex:
            - '^https?://localhost(:\d+)?$'
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
  # Resource server: bearer tokens obtained by the UI are validated here, never issued.
  # There is no login endpoint and no client secret. Every value below is deployment
  # configuration -- swapping the identity provider must not require a code change.
  #
  # The empty fallbacks are deliberate and are not defaults in any useful sense:
  # SecurityConfigurationCheck rejects a blank value while the application starts. Without
  # them these beans are built lazily, so a missing variable surfaces as a 500 on every
  # route -- /health included -- instead of as a failed startup.
  security:
    token:
      jwt:
        signatures:
          jwks:
            provider:
              url: ${OIDC_JWKS_URL:}
        claims-validators:
          issuer: ${OIDC_ISSUER:}
          audience: ${OIDC_AUDIENCE:}
          subject-not-null: true
    # Probes and metrics scraping call these without credentials. A pod whose probes
    # receive 401 never becomes ready, and the failure looks like a stuck rollout
    # rather than an authentication problem.
    endpoints:
      open:
        - /health
        - /prometheus
    intercept-url-map:
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
  logger:
    levels:
      io.micronaut.data: DEBUG
      io.micronaut.sql: DEBUG
      io.micronaut.http.server.cors: TRACE
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
        descriptions: true

# Management endpoints — /health for liveness/readiness probes,
# /prometheus for metrics scraping (both non-sensitive for internal scraping).
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
  prometheus:
    enabled: true
    sensitive: false

# OpenTelemetry — tracing is disabled unless OTEL_TRACES_EXPORTER=otlp is set
# (do this in the Docker/prod container). Metrics stay on Prometheus/Micrometer.
otel:
  service:
    name: ${OTEL_SERVICE_NAME:vulpes-backend}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:`http://localhost:4317`}
  exclusions:
    - /health
    - /health/.*
    - /prometheus
    - /swagger
    - /swagger/.*
    - /swagger-ui/.*

# Which claim identifies the caller. 'sub' is the portable default; an Entra ID
# deployment sets 'oid', because Entra's 'sub' is unique per app registration and
# therefore changes whenever that registration is replaced.
vulpes:
  security:
    identity-claim: ${OIDC_IDENTITY_CLAIM:sub}

# The connection itself -- url, username, password -- is deliberately absent. Every
# environment supplies its own: application-local.yml for local runs, and the ConfigMap
# and Secret mounted through MICRONAUT_CONFIG_FILES for a deployed instance. The values
# that used to stand here matched no environment at all and were overridden everywhere,
# while their presence stopped Micronaut Test Resources from providing a throwaway
# database to the test suite -- Test Resources only fills in properties that are missing.
#
# An instance started without them now fails instead of quietly dialling a database that
# does not exist.
datasources:
  default:
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: CREATE_DROP  # Change to `NONE` or `UPDATE` if you don't want schema recreation
    maximum-pool-size: 10

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl.auto: update  # Use `none` in production
        show_sql: true  # Logs SQL statements
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
