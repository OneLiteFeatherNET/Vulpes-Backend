micronaut:
  application:
    name: Vulpes Backend
  server:
    port: ${PORT:8085}
    cors:
      enabled: true
      configurations:
        all:
          allowedOriginsRegex:
            - '^https?://localhost(:\d+)?$'
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
  logger:
    levels:
      io.micronaut.data: DEBUG
      io.micronaut.sql: DEBUG
      io.micronaut.http.server.cors: TRACE
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT1M
        descriptions: true

# Management endpoints — /health for liveness/readiness probes,
# /prometheus for metrics scraping (both non-sensitive for internal scraping).
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
  prometheus:
    enabled: true
    sensitive: false

# OpenTelemetry — tracing is disabled unless OTEL_TRACES_EXPORTER=otlp is set
# (do this in the Docker/prod container). Metrics stay on Prometheus/Micrometer.
otel:
  service:
    name: ${OTEL_SERVICE_NAME:vulpes-backend}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:`http://localhost:4317`}
  exclusions:
    - /health
    - /health/.*
    - /prometheus
    - /swagger
    - /swagger/.*
    - /swagger-ui/.*

# No `datasources` block here on purpose: this file is the base config, active in
# every environment including `test`. A hardcoded connection here would permanently
# satisfy Micronaut's property lookup for `datasources.default.*`, which stops
# micronaut-test-resources from ever kicking in — it only supplies a
# Testcontainers-provisioned connection when those keys are otherwise unresolved.
# Local development gets its connection from `application-local.yml` (against the
# docker/compose.yml Postgres); tests get theirs from `application-test.yml`
# (test-resources-provisioned); a real deployment supplies its own via environment
# variables, which win over any YAML value regardless.

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl.auto: update  # Use `none` in production
        show_sql: true  # Logs SQL statements
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
