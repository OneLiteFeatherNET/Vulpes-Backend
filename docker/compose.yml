version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: vulpes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulpesdb
      POSTGRES_USER: vulpes
      POSTGRES_PASSWORD: vulpespassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
