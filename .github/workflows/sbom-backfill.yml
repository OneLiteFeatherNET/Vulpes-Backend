name: SBOM backfill

# Builds the SBOM of an already released version from its Docker image, attaches
# it to the GitHub release and sends it to Dependency-Track. New releases do this
# in release-please.yml; this covers the ones before.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version whose SBOM to publish, e.g. 3.7.0 (no leading v)"
        required: true
        type: string
      is_latest:
        description: "Mark this version as the latest one in Dependency-Track"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    name: Build the release SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        with:
          scan-type: image
          image-ref: ${{ secrets.HARBOR_REGISTRY }}/onelitefeather/vulpes-backend:${{ inputs.version }}
          format: cyclonedx
          output: bom.json
          exit-code: '0'

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v${VERSION}" bom.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the SBOM for Dependency-Track
        uses: actions/upload-artifact@v7
        with:
          name: sbom-release
          path: bom.json
          if-no-files-found: error
          retention-days: 1

  dependency-track:
    name: Publish SBOM to Dependency-Track
    needs: fetch
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Vulpes-Backend"
      project-version: ${{ inputs.version }}
      artifact-name: "sbom-release"
      sbom-path: "bom.json"
      parent-uuid: "a5b26cf1-d8e0-4815-b727-0a355a2354f6"
      is-latest: ${{ inputs.is_latest }}
    secrets: inherit
