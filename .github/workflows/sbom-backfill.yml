name: SBOM backfill

# Sends the SBOM attached to an existing GitHub release to Dependency-Track.
# New releases do this in release-please.yml; this covers the ones before.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version whose SBOM to publish, e.g. 3.7.0 (no leading v)"
        required: true
        type: string
      is_latest:
        description: "Mark this version as the latest one in Dependency-Track"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch the release SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Download bom.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern bom.json

      - name: Keep the SBOM for Dependency-Track
        uses: actions/upload-artifact@v7
        with:
          name: sbom-release
          path: bom.json
          if-no-files-found: error
          retention-days: 1

  dependency-track:
    name: Publish SBOM to Dependency-Track
    needs: fetch
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "Vulpes-Backend"
      project-version: ${{ inputs.version }}
      artifact-name: "sbom-release"
      sbom-path: "bom.json"
      parent-uuid: "a5b26cf1-d8e0-4815-b727-0a355a2354f6"
      is-latest: ${{ inputs.is_latest }}
    secrets: inherit
